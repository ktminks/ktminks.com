<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>JS Calculator</title>
</head>

<body>
    <div class="container text-center">
        <div id="calculator">
            <div class="row">
                <div class="col-12 text-right">
                    <div id="output">
                        <div id="sum">0</div>
                        <div id="progress">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div id="inputs">
                <div class="row">
                    <div class="col-3">
                        <div class="operand" id="clearall">AC</div>
                    </div>
                    <div class="col-6">
                        <div class="operand" id="delete">DEL</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons" id="add">+</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-3">
                        <div class="buttons">7</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">8</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">9</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons" id="subtract">-</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <div class="buttons">4</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">5</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">6</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons" id="multiply">*</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <div class="buttons">1</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">2</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">3</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons" id="divide">/</div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-3">
                        <div class="buttons">0</div>
                    </div>
                    <div class="col-3">
                        <div class="buttons">.</div>
                    </div>
                    <div class="col-6">
                        <div class="operand" id="compute">=</div>
                    </div>
                </div>
            </div>
        </div>
        <p>Designed and coded by KT Minckler</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
